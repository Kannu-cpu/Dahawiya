<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ila 7abibati ukhti</title>
<style>
  :root {
    --paper: #fdf6e9;
    --ink: #3b2a22;
    --accent: #c9826b;
    --leather: #5b3a2e;
    --gold: #e3c27a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: radial-gradient(circle at 30% 20%, #ffe9e1 0%, #f7d9cf 45%, #e9c5bb 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* falling flowers and confetti, always behind everything */
  #bg-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  /* ---------- screens ---------- */
  .screen { display: none; flex-direction: column; align-items: center; gap: 18px;
            text-align: center; padding: 24px; max-width: 460px; width: 100%;
            position: relative; z-index: 1; }
  .screen.active { display: flex; animation: fadeUp .7s ease both; }
  .big { font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: bold; line-height: 1.3; margin: 0; }
  .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  button {
    font: inherit; font-size: 1.05rem; padding: 12px 26px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 #a86652; transition: transform .1s, box-shadow .1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86652; }
  button.alt { background: #fff; color: var(--ink); box-shadow: 0 4px 0 #cdb7ae; }
  button.alt:active { box-shadow: 0 1px 0 #cdb7ae; }
  .screen-deco { position: absolute; width: 90px; height: 90px; pointer-events: none; opacity: .9; }
  .screen-deco.tl { top: -8px; left: -8px; }
  .screen-deco.br { bottom: -8px; right: -8px; transform: rotate(180deg); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- book ---------- */
  #book-wrap { display: none; flex-direction: column; align-items: center; gap: 16px; }
  #book-wrap.active { display: flex; animation: fadeUp .7s ease both; }
  .stage {
    position: relative; perspective: 1800px;
    width: min(92vw, 420px); height: min(72vh, 600px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .stage.closed { opacity: 0; transform: scale(.92); pointer-events: none; }
  .sheet {
    position: absolute; inset: 0; transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.45,.05,.25,1);
    cursor: pointer;
  }
  .sheet.flipped { transform: rotateY(-180deg); cursor: default; }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 6px 14px 14px 6px; overflow: hidden; padding: 28px 26px 34px;
    box-shadow: 0 10px 30px rgba(60,30,20,.25), inset 6px 0 10px -8px rgba(0,0,0,.25);
    background: linear-gradient(90deg, #f3e6d0 0%, var(--paper) 6%, var(--paper) 100%);
    font-size: 1.02rem; line-height: 1.75; text-align: left;
  }
  .face .text { position: relative; height: 100%; overflow-y: auto; padding: 22px 6px 0; }
  .face.back { transform: rotateY(180deg); background: var(--paper); }
  .face.cover {
    background: linear-gradient(135deg, var(--leather), #3d2519);
    color: var(--gold); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    border: 3px solid var(--gold); outline: 6px solid var(--leather);
    outline-offset: -14px; border-radius: 6px 14px 14px 6px;
  }
  .face.cover h2 { font-size: 1.8rem; margin: 0 0 10px; letter-spacing: 1px; position: relative; }
  .face.cover p { margin: 0; opacity: .85; font-style: italic; position: relative; }
  .pnum { position: absolute; bottom: 10px; right: 16px; font-size: .8rem; opacity: .5; }
  .face p { margin: 0 0 14px; }
  .deco { position: absolute; pointer-events: none; }
  .deco.tr { top: -6px; right: -6px; width: 110px; height: 110px; }
  .deco.bl { bottom: -6px; left: -6px; width: 110px; height: 110px; transform: rotate(180deg); }
  .deco.tl { top: -6px; left: -6px; width: 80px; height: 80px; transform: rotate(-90deg); }
  .deco.br { bottom: -6px; right: -6px; width: 80px; height: 80px; transform: rotate(90deg); }
  .cover-deco { position: absolute; width: 80px; height: 80px; opacity: .9; }
  .cover-deco.a { top: 10px; left: 10px; }
  .cover-deco.b { bottom: 10px; right: 10px; transform: rotate(180deg); }
  .hint { font-size: .95rem; opacity: .7; margin: 0; }

  #next { visibility: hidden; }
  #next.show { visibility: visible; animation: fadeUp .5s ease both; }

  .shadow-under {
    position: absolute; left: 8%; right: 8%; bottom: -14px; height: 18px;
    background: radial-gradient(ellipse at center, rgba(60,30,20,.35), transparent 70%);
    filter: blur(4px);
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- 1. Opening question -->
<section class="screen active" id="s-intro">
  <p class="big">HEYYY enti hnak?! ktebt lik ktab... tbghih tshtrih???</p>

<section class="screen" id="s-jk">

<!-- 6a. Yes reply -->

<!-- 6b. No reply -->
<section class="screen" id="s-no">
  <p class="big">ahhh ghadi ndir wahd a7sen mara jay</p>
</section>

<script>
/* =========================================================
   CONFIG: notifications to your phone (free, no account).
   1. Install the free "ntfy" app on your phone.
   2. Subscribe to a secret topic name you invent, e.g. "sister-book-x7k2q".
   3. Put that exact name below.
   ========================================================= */
const NTFY_TOPIC = 'REPLACE-with-your-secret-topic';

function notify(msg) {
  console.log('[notify]', msg);
  if (NTFY_TOPIC.startsWith('REPLACE')) return;
  fetch('https://ntfy.sh/' + NTFY_TOPIC, {
    method: 'POST', body: msg, headers: { Title: 'Sister book' }
  }).catch(() => {});
}

/* ---------- flower artwork (inline SVG) ---------- */
function flowerSVG(petal, center, size = 40) {
  let petals = '';
  for (let k = 0; k < 5; k++) {
    petals += `<ellipse cx="50" cy="26" rx="14" ry="24" fill="${petal}" opacity=".9" transform="rotate(${k * 72} 50 50)"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${petals}<circle cx="50" cy="50" r="10" fill="${center}"/></svg>`;
}
function leafSVG(color = '#7fae7a') {
  return `<svg width="34" height="20" viewBox="0 0 60 30"><path d="M2 15 Q30 -6 58 15 Q30 36 2 15Z" fill="${color}"/></svg>`;
}
/* a corner sprig: leaves and flowers, drawn once and reused on every page */
function sprigSVG() {
  return `<svg viewBox="0 0 110 110" width="100%" height="100%">
    <path d="M4 106 Q40 80 60 40 Q72 18 104 6" stroke="#8fb58a" stroke-width="3" fill="none"/>
    <path d="M30 86 Q18 70 26 56" stroke="#8fb58a" stroke-width="2" fill="none"/>
    <g transform="translate(60 40) scale(.55)">${flowerSVG('#f4a6b8', '#f7d36b', 100).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
    <g transform="translate(92 8) scale(.42)">${flowerSVG('#ffd27a', '#e6883f', 100).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
    <g transform="translate(14 82) scale(.36)">${flowerSVG('#c9a6f0', '#fff3b0', 100).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
    <g transform="translate(34 58) scale(.3)">${flowerSVG('#ffb3a7', '#fff', 100).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
    <g transform="translate(70 62) scale(.5)" opacity=".9">${leafSVG('#9ccc93').replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
    <g transform="translate(8 40) scale(.45)" opacity=".9">${leafSVG('#7fae7a').replace(/<svg[^>]*>|<\/svg>/g,'')}</g>
  </svg>`;
}
/* a row of small flowers for the bottom of the page */
function garlandSVG() {
  const colors = [['#f4a6b8','#f7d36b'],['#ffd27a','#e6883f'],['#c9a6f0','#fff3b0'],['#9fd3e6','#fff']];
  let s = `<svg viewBox="0 0 300 40" width="100%" height="30"><path d="M0 22 Q75 6 150 22 T300 22" stroke="#8fb58a" stroke-width="2" fill="none"/>`;
  for (let i = 0; i < 6; i++) {
    const [p, c] = colors[i % colors.length];
    s += `<g transform="translate(${20 + i * 50} ${i % 2 ? 14 : 26}) scale(.22)">${flowerSVG(p, c, 100).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>`;
  }
  return s + '</svg>';
}

/* ---------- decorations on the non-book screens ---------- */
function decorateScreens() {
  document.querySelectorAll('.screen').forEach(sc => {
    if (sc.id === 's-book') return;
    const tl = document.createElement('div');
    tl.className = 'screen-deco tl';
    tl.innerHTML = sprigSVG();
    const br = document.createElement('div');
    br.className = 'screen-deco br';
    br.innerHTML = sprigSVG();
    sc.prepend(tl);
    sc.appendChild(br);
  });
}
decorateScreens();

/* ---------- falling flowers and confetti (background) ---------- */
(function rain() {
  const canvas = document.getElementById('bg-canvas');
  const c = canvas.getContext('2d');
  const colors = ['#f4a6b8', '#ffd27a', '#c9a6f0', '#9fd3e6', '#ffb3a7', '#b7e4a6', '#f7d36b'];
  let W, H, pieces = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function make(initial) {
    const kind = Math.random() < 0.55 ? 'petal' : (Math.random() < 0.5 ? 'dot' : 'flower');
    return {
      kind,
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20 - Math.random() * 80,
      r: kind === 'flower' ? 8 + Math.random() * 8 : 3 + Math.random() * 5,
      vy: 0.6 + Math.random() * 1.2,
      vx: (Math.random() - 0.5) * 0.6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.04,
      sway: Math.random() * Math.PI * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 0.55 + Math.random() * 0.4
    };
  }

  function drawFlower(p) {
    c.save();
    c.translate(p.x, p.y); c.rotate(p.rot);
    for (let k = 0; k < 5; k++) {
      c.rotate((Math.PI * 2) / 5);
      c.beginPath();
      c.ellipse(0, -p.r * 0.6, p.r * 0.45, p.r * 0.7, 0, 0, Math.PI * 2);
      c.fillStyle = p.color; c.globalAlpha = p.alpha; c.fill();
    }
    c.beginPath(); c.arc(0, 0, p.r * 0.28, 0, Math.PI * 2);
    c.fillStyle = '#f7d36b'; c.globalAlpha = p.alpha; c.fill();
    c.restore();
  }
  function drawPetal(p) {
    c.save();
    c.translate(p.x, p.y); c.rotate(p.rot);
    c.beginPath();
    c.ellipse(0, 0, p.r, p.r * 0.5, 0, 0, Math.PI * 2);
    c.fillStyle = p.color; c.globalAlpha = p.alpha; c.fill();
    c.restore();
  }
  function drawDot(p) {
    c.beginPath(); c.arc(p.x, p.y, p.r * 0.6, 0, Math.PI * 2);
    c.fillStyle = p.color; c.globalAlpha = p.alpha; c.fill();
  }

  for (let i = 0; i < 45; i++) pieces.push(make(true));

  function frame() {
    c.clearRect(0, 0, W, H);
    for (const p of pieces) {
      p.sway += 0.02;
      p.x += p.vx + Math.sin(p.sway) * 0.5;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.kind === 'flower') drawFlower(p);
      else if (p.kind === 'petal') drawPetal(p);
      else drawDot(p);
      if (p.y > H + 30) Object.assign(p, make(false));
    }
    c.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- sound (generated, no files needed) ---------- */
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function pageFlipSound() {
  const c = ctx();
  const len = Math.floor(c.sampleRate * 0.55);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const env = Math.pow(1 - i / len, 2.5) * Math.min(1, i / (len * 0.08));
    d[i] = (Math.random() * 2 - 1) * env;
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.6;
  const g = c.createGain(); g.gain.value = 0.6;
  src.connect(bp).connect(g).connect(c.destination);
  src.start();
}
function pop() {
  try {
    const c = ctx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(520, c.currentTime + 0.15);
    g.gain.setValueAtTime(0.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.2);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.22);
  } catch (e) {}
}

/* ---------- screen navigation ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  pop();
}

document.getElementById('intro-yes').onclick = () => { show('s-price'); };
document.getElementById('intro-no').onclick  = () => { show('s-jk'); };
document.getElementById('pay-yes').onclick   = () => { show('s-jk'); };
document.getElementById('pay-no').onclick    = () => { show('s-jk'); };
document.getElementById('start').onclick     = () => { show('s-book'); openBookScreen(); };

document.getElementById('end-yes').onclick = () => {
  notify('My sister LIKED the book ❤️ (answered AH)');
  show('s-yes');
};
document.getElementById('end-no').onclick = () => {
  notify('My sister answered LA to the book question');
  show('s-no');
};

/* ---------- the book ---------- */
const PAGES = [
`<p>Walla 7atta law a3eesh alf 7ayat w bel-akhira atla3 b'ghayr denya, abadan ma akhtar gher enni akon akhuch. W min nawsal lil-janna, ana adablich w asawwich binti 7atta tseereen baby mithl ma kunti titmanna, w adeer baly 3alych w a7mi-ch mithl ma ay wa7ad bhal denya ma ysawwiha!</p>
<p>W 7atta bel-Quran, Allah subhanahu wa ta'ala bywassef w ybayyin 7ob el-ukht w 7ananiha 3ala akhuha, mitl ma shafna b'qissat sayyedna Musa w ukhtah el-shaja3a elli kanat turaqibah w tdafa3 3annee b'kull 7ob, w shlon Allah ja3al ukhtah sabab b'sa3adteh w ra7atch.</p>`,

`<p>Tadri, min abowasawi el-6abee3a w el-kawn, ashof-ch biha. Qalbi-ch safi w hatef mithl nesmat el-saba7 el-hadi2a, w quwwatch el-dakhliya mithl el-jibal el-rasiya elli ma tehazzha ay ree7 9awwiya.</p>
<p>Hatta law ente tishkki b-nafsich, ente mithl el-warda elli totla3 w tzewwer 7atta b-as3ab el-torab, t3ammar el-denya b-jamalha. W wafa2y el-ch mo mowaqqat; hatha mithl el-nuhur elli ma tenqa6i3 w el-nujoom elli ma tefariq sema al-leel abadan.</p>
<p>W law kadd ma kona b-makanat ba3eeda, el-masafa benatna mithl el-sema elli tetmaddeed 3al-ard — amaken mukhtalefa, laken nshoof nafs el-ufuq.</p>`,

`<p>Ana m3ach b'kull qarar takhdeeh, w da2eman ahib akon el-cheerleader maltech, a9addaq bech w athiq bech b'kull shay tqarrereh, w la tkhafeen abadan, ana ma a3ofich wala yom.</p>
<p>Mumken tet3ajbeen lees ana hek mte3alliq w mnasaf b'konni akhuch, w tgoleen 'enta ma sawwitli shay', laken walla ana 7assit nafsi zlama kabeer w 3indi dafe3 agood ukhti el-hilwa w asaadha min te7zan.</p>`,

`<p>Min tiji terkdeen w tibkeen 3an 7ayatich w t3tabreeni el-makan el-comfortable elli ykhallich trte7een, tibkeen w tifra7een b-ra7tich... walla 7assit enni a3ni shay kabeer la-shakhs ythiq bee w 7assit enni 'maws'oof' w maqbool w ma3roof b'qaymati, w hay el-sabab elli ykhalleni ma a3of sissy malti abadan ayma kanat el-zoroof.</p>`,

`<p>W Sissy malti hiye el-jameela, el-tayba, el-shaja3a, el-qawiya, el-mustaqilla, el-thakiya, w el-cute... w abadan hiye mosh mitl ma tetzannah 3an nafsha, hiye shakhsiya thanya tamamn, hiye cutie 7aggi 7lawa!</p>
<p>W asif iza ghaltet b'shay sissy, w alf alf shokr 3ala kull shay.</p>`
];

let sheets = [];
let cur = 0;
let busy = false;
let built = false;

function openBookScreen() {
  document.getElementById('book-wrap').classList.add('active');
  if (!built) buildBook();
}

function buildBook() {
  built = true;
  const total = PAGES.length + 1;

  // sheet 0 = cover, with flowers in two corners
  const cover = makeSheet(
    `<div class="face cover">
       <div class="cover-deco a">${sprigSVG()}</div>
       <div class="cover-deco b">${sprigSVG()}</div>
       <h2>Ila 7abibati<br>ukhti</h2><p>idghat lil-fat7</p>
     </div>`,
    `<div class="face back"></div>`, 0, total
  );
  sheets.push(cover);
  cover.addEventListener('click', () => { if (cur === 0) turnPage(); });

  // each text page gets sprigs on its corners and a flower garland at the bottom
  PAGES.forEach((html, i) => {
    const idx = i + 1;
    const s = makeSheet(
      `<div class="face">
         <div class="deco tr">${sprigSVG()}</div>
         <div class="deco bl">${sprigSVG()}</div>
         <div class="text">${html}</div>
         <span class="pnum">${idx}</span>
       </div>`,
      `<div class="face back"><div class="deco tl">${sprigSVG()}</div><div class="deco br">${sprigSVG()}</div></div>`,
      idx, total
    );
    sheets.push(s);
  });

  document.getElementById('next').onclick = turnPage;
}

function makeSheet(frontHtml, backHtml, i, total) {
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = frontHtml + backHtml;
  el.style.zIndex = total - i;
  document.getElementById('stage').appendChild(el);
  return el;
}

function turnPage() {
  if (busy) return;
  const s = sheets[cur];
  if (!s) return;
  busy = true;
  pageFlipSound();
  s.classList.add('flipped');
  s.style.zIndex = cur + 1;
  cur++;
  document.getElementById('hint').style.display = 'none';

  const nextBtn = document.getElementById('next');
  nextBtn.classList.remove('show');
  setTimeout(() => {
    busy = false;
    if (cur > PAGES.length) {
      document.getElementById('stage').classList.add('closed');
      setTimeout(() => {
        document.getElementById('book-wrap').classList.remove('active');
        show('s-end-q');
      }, 900);
    } else {
      nextBtn.classList.add('show');
    }
  }, 1000);
}
</script>
</body>
</html>
